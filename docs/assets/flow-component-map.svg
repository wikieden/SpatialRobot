<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img">
  <title>Chronotope component map</title>
  <desc>Sensors feed worldsense, then tempomem memory, then mindloop brain, which drives bodylink and voicelink seams and emits traces; skillforge wraps all for self-learning.</desc>
  <rect x="0" y="0" width="780" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#666"/>
    </marker>
  </defs>

  <rect x="128" y="206" width="582" height="92" rx="10" fill="#fdf0d5" stroke="#e0a106" stroke-dasharray="6 4"/>
  <text x="148" y="232" font-size="12" font-weight="700" fill="#9a6f00">skillforge · ENPIRE self-learning lab</text>
  <text x="148" y="252" font-size="10.5" fill="#555">imports all members · drives mem+brain+body+world · only member importing every other</text>
  <text x="148" y="282" font-size="10" fill="#888">numpy-only core (tempomem) imports none of the others — dependency never inverts</text>

  <rect x="16" y="64" width="92" height="64" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="62" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a1a1a">Sensors</text>
  <text x="62" y="107" text-anchor="middle" font-size="10" fill="#555">RGB-D · mic</text>

  <rect x="140" y="64" width="118" height="64" rx="8" fill="#e0f5f1" stroke="#1aa179"/>
  <text x="199" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">worldsense</text>
  <text x="199" y="103" text-anchor="middle" font-size="10" fill="#555">eyes</text>
  <text x="199" y="118" text-anchor="middle" font-size="9.5" fill="#555">world Detections</text>

  <rect x="290" y="64" width="118" height="64" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="349" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">tempomem</text>
  <text x="349" y="103" text-anchor="middle" font-size="10" fill="#555">memory core</text>
  <text x="349" y="118" text-anchor="middle" font-size="9.5" fill="#555">regions·history·decay</text>

  <rect x="440" y="64" width="118" height="64" rx="8" fill="#fdf0d5" stroke="#e0a106"/>
  <text x="499" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">mindloop</text>
  <text x="499" y="103" text-anchor="middle" font-size="10" fill="#555">brain</text>
  <text x="499" y="118" text-anchor="middle" font-size="9.5" fill="#555">route→plan→safety→act</text>

  <rect x="590" y="40" width="120" height="42" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="650" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a1a1a">bodylink</text>
  <text x="650" y="74" text-anchor="middle" font-size="9.5" fill="#555">executor · D3 manifest</text>

  <rect x="590" y="110" width="120" height="42" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="650" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a1a1a">voicelink</text>
  <text x="650" y="144" text-anchor="middle" font-size="9.5" fill="#555">ASR ears · TTS mouth</text>

  <rect x="440" y="160" width="118" height="34" rx="8" fill="#eef4ff" stroke="#4285f4"/>
  <text x="499" y="182" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a1a">TraceStore (cited)</text>

  <line x1="108" y1="96" x2="138" y2="96" stroke="#666" marker-end="url(#a)"/>
  <line x1="258" y1="96" x2="288" y2="96" stroke="#666" marker-end="url(#a)"/>
  <text x="273" y="90" text-anchor="middle" font-size="8.5" fill="#888">Detections</text>
  <line x1="408" y1="96" x2="438" y2="96" stroke="#666" marker-end="url(#a)"/>
  <text x="423" y="90" text-anchor="middle" font-size="8.5" fill="#888">scene</text>
  <line x1="558" y1="80" x2="588" y2="66" stroke="#666" marker-end="url(#a)"/>
  <text x="576" y="70" text-anchor="middle" font-size="8" fill="#888">SubTask</text>
  <line x1="588" y1="131" x2="560" y2="118" stroke="#666" marker-end="url(#a)"/>
  <line x1="499" y1="128" x2="499" y2="158" stroke="#666" marker-end="url(#a)"/>
</svg>
