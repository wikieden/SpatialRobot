<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img">
  <title>Brain request lifecycle</title>
  <desc>An utterance is routed to chat, question, or task; tasks go plan, compile with D3 gate, L5 preference, Phylax safety, dispatch loop, trace.</desc>
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#666"/>
    </marker>
  </defs>

  <rect x="300" y="16" width="180" height="42" rx="21" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="390" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">utterance</text>
  <text x="390" y="51" text-anchor="middle" font-size="9.5" fill="#555">+ person + role</text>
  <line x1="390" y1="58" x2="390" y2="80" stroke="#666" marker-end="url(#b)"/>

  <rect x="312" y="82" width="156" height="46" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="390" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">IntentRouter</text>
  <text x="390" y="119" text-anchor="middle" font-size="9.5" fill="#555">classify</text>

  <line x1="312" y1="105" x2="150" y2="150" stroke="#666" marker-end="url(#b)"/>
  <text x="210" y="128" text-anchor="middle" font-size="9" fill="#888">chat</text>
  <line x1="390" y1="128" x2="390" y2="150" stroke="#666" marker-end="url(#b)"/>
  <text x="406" y="143" text-anchor="middle" font-size="9" fill="#888">question</text>
  <line x1="468" y1="105" x2="628" y2="150" stroke="#666" marker-end="url(#b)"/>
  <text x="566" y="128" text-anchor="middle" font-size="9" fill="#888">task</text>

  <rect x="74" y="150" width="150" height="40" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="149" y="174" text-anchor="middle" font-size="11" fill="#1a1a1a">smalltalk reply</text>
  <rect x="316" y="150" width="148" height="40" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="390" y="167" text-anchor="middle" font-size="11" fill="#1a1a1a">memory query</text>
  <text x="390" y="182" text-anchor="middle" font-size="9" fill="#555">cite node ids</text>

  <rect x="556" y="150" width="148" height="40" rx="8" fill="#fdf0d5" stroke="#e0a106"/>
  <text x="630" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Planner (LLM)</text>
  <text x="630" y="182" text-anchor="middle" font-size="9" fill="#555">text verb sequence</text>
  <line x1="630" y1="190" x2="630" y2="208" stroke="#666" marker-end="url(#b)"/>
  <rect x="556" y="208" width="148" height="40" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="630" y="225" text-anchor="middle" font-size="11" fill="#1a1a1a">compile · D3 gate</text>
  <text x="630" y="240" text-anchor="middle" font-size="9" fill="#555">bind verbs to node ids</text>
  <line x1="630" y1="248" x2="630" y2="266" stroke="#666" marker-end="url(#b)"/>
  <rect x="556" y="266" width="148" height="36" rx="8" fill="#f5f5f5" stroke="#cfcfcf"/>
  <text x="630" y="288" text-anchor="middle" font-size="11" fill="#1a1a1a">L5 preference overlay</text>
  <line x1="630" y1="302" x2="630" y2="320" stroke="#666" marker-end="url(#b)"/>

  <rect x="556" y="320" width="148" height="48" rx="8" fill="#e6f4ea" stroke="#1e8e3e"/>
  <text x="630" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Phylax safety</text>
  <text x="630" y="356" text-anchor="middle" font-size="9" fill="#555">role·region·privacy</text>
  <line x1="556" y1="344" x2="470" y2="344" stroke="#666" marker-end="url(#b)"/>
  <rect x="322" y="324" width="142" height="40" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="393" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">refuse: stop + speak</text>
  <text x="510" y="338" text-anchor="middle" font-size="8.5" fill="#888">block</text>
  <line x1="630" y1="368" x2="630" y2="388" stroke="#666" marker-end="url(#b)"/>
  <text x="648" y="382" text-anchor="middle" font-size="8.5" fill="#888">clear</text>
  <rect x="540" y="388" width="180" height="44" rx="8" fill="#fdf0d5" stroke="#e0a106"/>
  <text x="630" y="408" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">preemptible dispatch loop</text>
  <text x="630" y="424" text-anchor="middle" font-size="9" fill="#555">barge-in · replan · ask-human</text>

  <rect x="40" y="408" width="170" height="40" rx="8" fill="#eef4ff" stroke="#4285f4"/>
  <text x="125" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">TraceStore</text>
  <text x="125" y="439" text-anchor="middle" font-size="9" fill="#555">episodes cite node ids</text>
  <path d="M149 190 L149 408" fill="none" stroke="#aaa" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <path d="M390 190 L390 398 L212 426" fill="none" stroke="#aaa" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <path d="M540 410 L214 428" fill="none" stroke="#aaa" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="120" y="360" text-anchor="middle" font-size="8.5" fill="#888">all paths traced</text>
</svg>
